name: Deploy to NEOSERV

on:
  push:
    branches: [main]
  # Manual redeploy from the Actions tab (same checks, same upload)
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push waits for the running upload to finish
# instead of cancelling it halfway through (which could leave the site half-updated).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # prebuild pre-sizes images, then next build writes the static site to out/
      - name: Build static site
        run: npm run build

      - name: Upload out/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps # explicit TLS
          port: 21
          local-dir: ./out/
          # The FTP account's root is already public_html
          server-dir: ./
          # Incremental sync: only files this action uploaded before are ever replaced or
          # deleted (tracked in .ftp-deploy-sync-state.json, which .htaccess never serves).
          # Never set dangerous-clean-slate. The excludes below keep cPanel's own folders out
          # of the sync entirely; the first three lines restate the action's defaults.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .well-known/**
            cgi-bin/**
